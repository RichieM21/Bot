name: Christmas Countdown

on:
  schedule:
    - cron: "0 1 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

jobs:
  christmas-countdown:
    runs-on: ubuntu-latest
    steps:
      - name: Check Eastern Time
        id: time
        run: |
          HOUR=$(TZ=America/New_York date +%H)
          MINUTE=$(TZ=America/New_York date +%M)
          DATE=$(TZ=America/New_York date +%Y-%m-%d)
          echo "hour=$HOUR" >> "$GITHUB_OUTPUT"
          echo "minute=$MINUTE" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Send countdown
        if: steps.time.outputs.hour == '01' || github.event_name == 'workflow_dispatch'
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: "1430731225944821842"
        run: |
          python - <<'PY'
          import json, os, random, urllib.request
          from datetime import date, datetime
          from zoneinfo import ZoneInfo

          eastern_now = datetime.now(ZoneInfo("America/New_York"))
          today = eastern_now.date()

          christmas = date(today.year, 12, 25)
          if today >= christmas:
              christmas = date(today.year + 1, 12, 25)
          days = (christmas - today).days

          if days == 0:
              title = "🎄🎅 MERRY CHRISTMAS! 🎅🎄"
              description = "🎁 Hope everyone has an amazing Christmas! ❤️" + chr(10) + chr(10) + "☃️ Enjoy the holiday and spread the Christmas spirit!"
          else:
              messages = [
                  ("🎅 GOOD MORNING! 🎅", f"🎄 **{days} days** until Christmas! 🎁" + chr(10) + chr(10) + "✨ The countdown is officially on!"),
                  ("🎄 CHRISTMAS COUNTDOWN! 🎄", f"🎅 Only **{days} days** until Christmas! 🎁✨" + chr(10) + chr(10) + "☃️ Who's ready?!"),
                  ("❄️ Christmas Countdown ❄️", f"🎄 **{days} days** to go until Christmas! 🎅🎁" + chr(10) + chr(10) + "🔔 Keep spreading the Christmas spirit!")
              ]
              title, description = random.choice(messages)

          embed = {
              "title": title,
              "description": description,
              "color": 16711680,
              "footer": {"text": "🎅 Christmas Countdown • See you Christmas morning!"},
              "timestamp": datetime.now(ZoneInfo("America/New_York")).isoformat()
          }

          token = os.environ["DISCORD_TOKEN"]
          channel = os.environ["CHANNEL_ID"]
          req = urllib.request.Request(
              f"https://discord.com/api/v10/channels/{channel}/messages",
              data=json.dumps({"embeds": [embed]}).encode(),
              headers={
                  "Authorization": f"Bot {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "ChristmasCountdown/1.0"
              },
              method="POST",
          )
          with urllib.request.urlopen(req) as response:
              print(f"Discord response: {response.status}")
          PY
