name: Christmas Countdown

on:
  schedule:
    - cron: "5 1 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      preview:
        description: "Send the November 1 IT’S TIME! preview"
        required: false
        default: false
        type: boolean

jobs:
  christmas-countdown:
    runs-on: ubuntu-latest
    steps:
      - name: Send countdown
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: "1430731225944821842"
          PREVIEW: ${{ inputs.preview }}
        run: |
          python - <<'PY'
          import json, os, random, time, urllib.request
          from datetime import date, datetime
          from zoneinfo import ZoneInfo

          eastern_now = datetime.now(ZoneInfo("America/New_York"))
          today = eastern_now.date()

          christmas = date(today.year, 12, 25)
          if today >= christmas:
              christmas = date(today.year + 1, 12, 25)
          days = (christmas - today).days

          preview = os.environ.get("PREVIEW", "").lower() == "true"
          gif_url = None

          if today == date(today.year, 11, 1) or preview:
              title = "🎄🎅 IT’S TIME! 🎅🎄"
              description = "🎄 **CHRISTMAS COUNTDOWN HAS OFFICIALLY BEGUN!** 🎄" + chr(10) + chr(10) + "🎅 Mariah has been defrosted. It's time for Christmas! ❤️🎄" + chr(10) + "🎁 54 days until Christmas!"
              color = 16711680
              countdown_label = "🎄 54 days until Christmas!"
              gif_url = "https://media1.tenor.com/m/cdNE49GG_mAAAAAd/mariah-carey-its-time-xmas-christmas.gif"
          elif days == 0:
              title = "🎄🎅 MERRY CHRISTMAS! 🎅🎄"
              description = "🎁 **Christmas is finally here!** ❤️" + chr(10) + chr(10) + "☃️ Hope everyone has an amazing Christmas filled with fun, food, family, friends, and plenty of Christmas spirit! ✨"
              color = 16711680
              countdown_label = "🎁 It's Christmas!"
          else:
              messages = [
                  ("🎄✨ CHRISTMAS COUNTDOWN ✨🎄", f"🎅 **{days} days** until Christmas! 🎁" + chr(10) + chr(10) + "☃️ The countdown is officially on!" + chr(10) + "🔔 Get ready for the most wonderful time of the year! ❤️"),
                  ("🎅🎄 GOOD MORNING! 🎄🎅", f"✨ There are **{days} days** left until Christmas! 🎁" + chr(10) + chr(10) + "☃️ Keep spreading the Christmas spirit!" + chr(10) + "🎁 Santa is getting closer... 👀"),
                  ("❄️🎄 CHRISTMAS IS COMING! 🎄❄️", f"🎁 Only **{days} days** to go! 🎅" + chr(10) + chr(10) + "✨ Time to get into the Christmas spirit! 🎅" + chr(10) + "☃️ Who's ready?! ❤️")
              ]
              title, description = random.choice(messages)
              color = 16711680
              countdown_label = f"🎄 {days} days remaining"

          token = os.environ["DISCORD_TOKEN"]
          channel = os.environ["CHANNEL_ID"]
          api_url = f"https://discord.com/api/v10/channels/{channel}/messages"
          auth_headers = {
              "Authorization": f"Bot {token}",
              "User-Agent": "ChristmasCountdown/1.0"
          }

          def send_json(payload):
              req = urllib.request.Request(
                  api_url,
                  data=json.dumps(payload).encode(),
                  headers={**auth_headers, "Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req) as response:
                  print(f"Discord response: {response.status}")

          def send_gif(url):
              gif_data = urllib.request.urlopen(url).read()
              boundary = "----BloxyWorldChristmasBoundary"
              payload = {
                  "embeds": [{
                      "image": {"url": "attachment://mariah.gif"}
                  }]
              }
              parts = []
              parts.append(
                  f"--{boundary}\r\n"
                  'Content-Disposition: form-data; name="payload_json"\r\n'
                  "Content-Type: application/json\r\n\r\n"
                  + json.dumps(payload)
                  + "\r\n"
              )
              parts.append(
                  f"--{boundary}\r\n"
                  'Content-Disposition: form-data; name="files[0]"; filename="mariah.gif"\r\n'
                  "Content-Type: image/gif\r\n\r\n"
              )
              body = "".join(parts).encode() + gif_data + f"\r\n--{boundary}--\r\n".encode()

              req = urllib.request.Request(
                  api_url,
                  data=body,
                  headers={
                      **auth_headers,
                      "Content-Type": f"multipart/form-data; boundary={boundary}"
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req) as response:
                  print(f"Discord GIF response: {response.status}")

          # On November 1 (or preview), send the actual GIF as its own message first.
          if gif_url:
              send_gif(gif_url)
              time.sleep(1)

          embed = {
              "title": title,
              "description": description,
              "color": color,
              "fields": [
                  {"name": "⏰ Countdown", "value": countdown_label, "inline": True},
                  {"name": "📅 Christmas Day", "value": "December 25 🎁", "inline": True}
              ],
              "footer": {"text": "🎅 Christmas Countdown • New message every morning at 1:05 AM ET"},
              "timestamp": eastern_now.isoformat()
          }

          send_json({"embeds": [embed]})
          PY
