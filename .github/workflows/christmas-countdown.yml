name: Christmas Countdown

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  christmas-countdown:
    runs-on: ubuntu-latest
    steps:
      - name: Check Eastern Time
        id: time
        run: |
          HOUR=$(TZ=America/New_York date +%H)
          DATE=$(TZ=America/New_York date +%Y-%m-%d)
          echo "hour=$HOUR" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Send countdown
        if: steps.time.outputs.hour == '00'
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: "1430731225944821842"
        run: |
          DAYS=$(python - <<'PY'
          from datetime import date
          import zoneinfo
          now = date.today()
          # GitHub runners are UTC; use Eastern date explicitly.
          from datetime import datetime
          eastern = datetime.now(zoneinfo.ZoneInfo("America/New_York")).date()
          christmas = date(eastern.year, 12, 25)
          if eastern >= christmas:
              christmas = date(eastern.year + 1, 12, 25)
          print((christmas - eastern).days)
          PY
          )

          if [ "$DAYS" -eq 0 ]; then
            MESSAGE='🎄🎅 **MERRY CHRISTMAS!** 🎅🎄\n\n🎁 Hope everyone has an amazing Christmas! ❤️'
          else
            MESSAGES=(
              "🎄 **CHRISTMAS COUNTDOWN!** 🎄\n\n🎅 Only **$DAYS days** until Christmas! 🎁✨\n\n☃️ The countdown is officially on!"
              "🎅 **GOOD MORNING!** 🎅\n\n🎄 **$DAYS days** until Christmas! 🎁\n\n🔔 Keep spreading the Christmas spirit! ✨"
              "❄️ **Christmas Countdown** ❄️\n\n🎄 **$DAYS days** to go until Christmas! 🎅🎁\n\n☃️ Who's ready?!"
            )
            MESSAGE="${MESSAGES[$((RANDOM % 3))]}"
          fi

          python - <<'PY'
          import json, os, urllib.request
          token = os.environ["DISCORD_TOKEN"]
          channel = os.environ["CHANNEL_ID"]
          message = os.environ["MESSAGE"]
          req = urllib.request.Request(
              f"https://discord.com/api/v10/channels/{channel}/messages",
              data=json.dumps({"content": message}).encode(),
              headers={
                  "Authorization": f"Bot {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "ChristmasCountdown/1.0"
              },
              method="POST",
          )
          with urllib.request.urlopen(req) as r:
              print(r.status)
          PY
        env:
          MESSAGE: ${{ env.MESSAGE }}
