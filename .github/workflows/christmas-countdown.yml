name: Christmas Countdown

on:
  schedule:
    - cron: "5 0 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

jobs:
  christmas-countdown:
    runs-on: ubuntu-latest
    steps:
      - name: Check Eastern Time
        id: time
        run: |
          HOUR=$(TZ=America/New_York date +%H)
          DATE=$(TZ=America/New_York date +%Y-%m-%d)
          echo "hour=$HOUR" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Send countdown
        if: steps.time.outputs.hour == '00'
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: "1430731225944821842"
        run: |
          python - <<'PY'
          import json, os, random, urllib.request
          from datetime import date, datetime
          from zoneinfo import ZoneInfo

          eastern = datetime.now(ZoneInfo("America/New_York")).date()
          christmas = date(eastern.year, 12, 25)
          if eastern >= christmas:
              christmas = date(eastern.year + 1, 12, 25)
          days = (christmas - eastern).days

          if days == 0:
              message = "🎄🎅 **MERRY CHRISTMAS!** 🎅🎄\\n\\n🎁 Hope everyone has an amazing Christmas! ❤️"
          else:
              messages = [
                  f"🎄 **CHRISTMAS COUNTDOWN!** 🎄\\n\\n🎅 Only **{days} days** until Christmas! 🎁✨\\n\\n☃️ The countdown is officially on!",
                  f"🎅 **GOOD MORNING!** 🎅\\n\\n🎄 **{days} days** until Christmas! 🎁\\n\\n🔔 Keep spreading the Christmas spirit! ✨",
                  f"❄️ **Christmas Countdown** ❄️\\n\\n🎄 **{days} days** to go until Christmas! 🎅🎁\\n\\n☃️ Who's ready?!"
              ]
              message = random.choice(messages)

          token = os.environ["DISCORD_TOKEN"]
          channel = os.environ["CHANNEL_ID"]
          req = urllib.request.Request(
              f"https://discord.com/api/v10/channels/{channel}/messages",
              data=json.dumps({"content": message}).encode(),
              headers={
                  "Authorization": f"Bot {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "ChristmasCountdown/1.0"
              },
              method="POST",
          )
          with urllib.request.urlopen(req) as response:
              print(f"Discord response: {response.status}")
          PY
