services:
  - type: web
    name: roblox-ranking-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off

    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: DATA_DIR
        value: "/var/data"
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: ROBLOX_API_KEY
        sync: false
      - key: ROBLOX_GROUP_ID
        sync: false
      - key: DISCORD_STAFF_ROLE_ID
        sync: false
      - key: LOG_CHANNEL_ID
        sync: false

    disk:
      name: roblox-ranking-data
      mountPath: /var/data
      sizeGB: 1
